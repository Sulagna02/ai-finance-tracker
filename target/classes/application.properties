server.port=${SERVER_PORT:8080}

# PostgreSQL Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema is managed by Flyway, not Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway — auto-applies migrations in db/migration/ on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:3d8f2c6a1b9e4f7d0a5c8e2b6f1d4a7c9e3b5f8d2a6c1e4b7f0d3a8c5e2b9f6}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Spring AI - OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# Actuator — only expose health endpoint; no sensitive data exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.com.financeai=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
